<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Hub</title>
<meta name="description" content="A tiny portal with three doors.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 18l4.5 13.5L50 36l-13.5 4.5L32 54l-4.5-13.5L14 36l13.5-4.5z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060f;
    --text: #f4f6ff;
    --muted: rgba(244, 246, 255, 0.55);
    --yt: #ff0033;
    --gp: #f59e0b;
    --glass: rgba(255, 255, 255, 0.045);
    --glass-border: rgba(255, 255, 255, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ---------- animated background ---------- */

  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.4;
    will-change: transform;
  }
  .orb-1 {
    width: 560px; height: 560px;
    background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
    top: -12%; left: -8%;
    animation: drift1 26s ease-in-out infinite alternate;
  }
  .orb-2 {
    width: 480px; height: 480px;
    background: radial-gradient(circle, #22d3ee 0%, transparent 70%);
    bottom: -18%; right: -6%;
    animation: drift2 32s ease-in-out infinite alternate;
  }
  .orb-3 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #e879f9 0%, transparent 70%);
    bottom: 10%; left: 28%;
    opacity: 0.28;
    animation: drift3 38s ease-in-out infinite alternate;
  }

  @keyframes drift1 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(90px, 70px) scale(1.15); }
  }
  @keyframes drift2 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-80px, -60px) scale(1.2); }
  }
  @keyframes drift3 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(60px, -80px) scale(0.9); }
  }

  .grid-overlay {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 52px 52px;
    -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, black 20%, transparent 75%);
    mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, black 20%, transparent 75%);
  }

  .particles { position: absolute; inset: 0; }

  .particle {
    position: absolute;
    bottom: -10px;
    border-radius: 50%;
    background: white;
    opacity: 0;
    animation: rise var(--dur) linear var(--delay) infinite;
  }

  @keyframes rise {
    0%   { transform: translateY(0); opacity: 0; }
    10%  { opacity: var(--max-op); }
    90%  { opacity: var(--max-op); }
    100% { transform: translateY(-110vh); opacity: 0; }
  }

  /* ---------- content ---------- */

  main {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 48px 24px;
    max-width: 1300px;
    width: 100%;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--glass-border);
    background: var(--glass);
    padding: 8px 16px;
    border-radius: 100px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
  }

  .badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 10px #34d399;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.75); }
  }

  h1 {
    margin: 28px 0 14px;
    font-size: clamp(40px, 7vw, 68px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.03em;
    animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
  }

  h1 .accent {
    background: linear-gradient(100deg, #a78bfa, #22d3ee, #e879f9);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 6s linear infinite;
  }

  @keyframes shimmer {
    to { background-position: 200% center; }
  }

  .subtitle {
    color: var(--muted);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: clamp(15px, 2vw, 17px);
    line-height: 1.6;
    animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
  }

  .cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 52px;
  }

  /* ---------- link cards ---------- */

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    width: min(384px, 100%);
    padding: 22px 24px;
    text-decoration: none;
    color: var(--text);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    background: var(--glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    overflow: hidden;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.45s ease,
                box-shadow 0.45s ease;
  }
  .card-yt { animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both; }
  .card-gp { animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both; }
  .card-hc { animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.7s both; }

  /* keyboard focus always gets the lifted state */
  .card:focus-visible {
    transform: translateY(-8px) scale(1.015);
    outline: none;
  }

  /* pointer hover states: only on devices that really hover */
  @media (hover: hover) and (pointer: fine) {
    .card:hover { transform: translateY(-8px) scale(1.015); }

    .card-yt:hover {
      border-color: rgba(255, 0, 51, 0.55);
      box-shadow: 0 24px 70px -18px rgba(255, 0, 51, 0.45),
                  0 0 0 1px rgba(255, 0, 51, 0.2) inset;
    }
    .card-gp:hover {
      border-color: rgba(245, 158, 11, 0.55);
      box-shadow: 0 24px 70px -18px rgba(245, 158, 11, 0.4),
                  0 0 0 1px rgba(245, 158, 11, 0.2) inset;
    }
    .card-hc:hover {
      border-color: rgba(168, 85, 247, 0.6);
      box-shadow: 0 24px 70px -18px rgba(168, 85, 247, 0.5),
                  0 0 0 1px rgba(168, 85, 247, 0.25) inset;
    }

    .card:hover .logo { transform: scale(1.08) rotate(-3deg); }

    .card:hover::after { transform: translateX(130%); }

    .card:hover .arrow { transform: translateX(4px); }
    .card-yt:hover .arrow { background: rgba(255, 0, 51, 0.18); border-color: rgba(255, 0, 51, 0.5); }
    .card-gp:hover .arrow { background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.5); }
    .card-hc:hover .arrow { background: rgba(168, 85, 247, 0.18); border-color: rgba(168, 85, 247, 0.5); }
  }

  .card-yt:focus-visible {
    border-color: rgba(255, 0, 51, 0.55);
    box-shadow: 0 24px 70px -18px rgba(255, 0, 51, 0.45),
                0 0 0 1px rgba(255, 0, 51, 0.2) inset;
  }
  .card-gp:focus-visible {
    border-color: rgba(245, 158, 11, 0.55);
    box-shadow: 0 24px 70px -18px rgba(245, 158, 11, 0.4),
                0 0 0 1px rgba(245, 158, 11, 0.2) inset;
  }
  .card-hc:focus-visible {
    border-color: rgba(168, 85, 247, 0.6);
    box-shadow: 0 24px 70px -18px rgba(168, 85, 247, 0.5),
                0 0 0 1px rgba(168, 85, 247, 0.25) inset;
  }
  .card:focus-visible .logo { transform: scale(1.08) rotate(-3deg); }
  .card:focus-visible::after { transform: translateX(130%); }
  .card:focus-visible .arrow { transform: translateX(4px); }
  .card-yt:focus-visible .arrow { background: rgba(255, 0, 51, 0.18); border-color: rgba(255, 0, 51, 0.5); }
  .card-gp:focus-visible .arrow { background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.5); }
  .card-hc:focus-visible .arrow { background: rgba(168, 85, 247, 0.18); border-color: rgba(168, 85, 247, 0.5); }

  /* shine sweep */
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,0.14) 50%, transparent 58%);
    transform: translateX(-130%);
    transition: transform 0.9s ease;
    pointer-events: none;
  }

  .logo {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .logo-yt {
    border-radius: 22px;
    background: linear-gradient(145deg, #ff2b55, #d50027);
    box-shadow: 0 10px 28px -8px rgba(255, 0, 51, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .logo-yt svg { width: 34px; height: 34px; fill: #ffffff; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }

  .logo-gp {
    border-radius: 50%;
    padding: 0;
    overflow: hidden;
    border: 2px solid rgba(245, 158, 11, 0.4);
    box-shadow: 0 10px 28px -8px rgba(245, 158, 11, 0.5);
  }
  .logo-gp img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .logo-hc {
    border-radius: 50%;
    padding: 0;
    overflow: hidden;
    border: 2px solid rgba(168, 85, 247, 0.45);
    box-shadow: 0 10px 28px -8px rgba(168, 85, 247, 0.5);
    background: rgba(168, 85, 247, 0.1);
  }
  .logo-hc img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .card-text { display: flex; flex-direction: column; gap: 5px; text-align: left; min-width: 0; }

  .card-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .card-domain {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 11.5px;
    color: rgba(244, 246, 255, 0.68);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .arrow {
    margin-left: auto;
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.05);
    transition: background 0.4s ease, border-color 0.4s ease, transform 0.4s ease;
  }
  .arrow svg { width: 13px; height: 13px; stroke: var(--text); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.4s ease; }

  footer {
    margin-top: 64px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 12.5px;
    color: rgba(244, 246, 255, 0.35);
    letter-spacing: 0.04em;
    animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.85s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(26px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .cards { flex-direction: column; align-items: center; }
    .card { width: 100%; }
    footer { margin-top: 48px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>

  <script>
    // floating particles
    (function () {
      var wrap = document.getElementById('particles');
      var count = window.innerWidth < 640 ? 22 : 42;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < count; i++) {
        var p = document.createElement('span');
        p.className = 'particle';
        var size = 1.5 + Math.random() * 2.5;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = (Math.random() * 100) + '%';
        p.style.setProperty('--dur', (9 + Math.random() * 16) + 's');
        p.style.setProperty('--delay', (Math.random() * -25) + 's');
        p.style.setProperty('--max-op', (0.15 + Math.random() * 0.4).toFixed(2));
        frag.appendChild(p);
      }
      wrap.appendChild(frag);
    })();

    // gentle pointer parallax on the glow orbs
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;
      var orbs = document.querySelectorAll('.orb');
      var tx = 0, ty = 0, cx = 0, cy = 0;
      window.addEventListener('pointermove', function (e) {
        tx = (e.clientX / window.innerWidth - 0.5) * 2;
        ty = (e.clientY / window.innerHeight - 0.5) * 2;
      });
      (function loop() {
        cx += (tx - cx) * 0.04;
        cy += (ty - cy) * 0.04;
        orbs.forEach(function (orb, i) {
          var depth = (i + 1) * 14;
          orb.style.marginLeft = (-cx * depth) + 'px';
          orb.style.marginTop = (-cy * depth) + 'px';
        });
        requestAnimationFrame(loop);
      })();
    })();
  </script>
