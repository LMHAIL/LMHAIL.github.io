<meta name="theme-color" content="#0e0f13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233ecf8e'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='34' font-weight='bold' fill='%230e0f13' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0e0f13;
    background-image: radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1.1px);
    background-size: 26px 26px;
    color: #ececf1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  /* faint cool glow at the top */
  body::before {
    content: '';
    position: fixed;
    top: -180px;
    left: 50%;
    translate: -50% 0;
    width: 860px;
    height: 480px;
    background: radial-gradient(closest-side, rgba(118, 134, 255, 0.09), transparent 72%);
    pointer-events: none;
  }

  ::selection { background: rgba(62, 207, 142, 0.3); }

  main { position: relative; width: 100%; max-width: 500px; }

  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }

  .sub {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 8px;
    font-size: 14px;
    color: #8f939c;
  }

  .dot {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3ecf8e;
    box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.14);
  }

  .head {
    padding-bottom: 22px;
    border-bottom: 1px solid #1e2129;
    margin-bottom: 26px;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #15171d;
    border: 1px solid #24272f;
    border-radius: 12px;
    padding: 15px 18px;
    text-decoration: none;
    color: inherit;
    transition: background .18s ease, border-color .18s ease, translate .18s ease;
  }
  .card:hover {
    background: #191c23;
    border-color: #353b47;
    translate: 0 -1px;
  }
  .card:focus-visible {
    outline: 2px solid #3ecf8e;
    outline-offset: 2px;
  }

  .icon {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 11px;
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .icon svg { width: 23px; height: 23px; fill: #fff; }
  .icon-yt { background: #ff0000; }

  .meta { flex: 1; min-width: 0; }

  .card-title {
    display: block;
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.25;
    color: #f2f3f5;
  }

  .chip {
    display: block;
    margin-top: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    color: #7e838d;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ext {
    flex-shrink: 0;
    color: #565b66;
    transition: color .18s ease, translate .18s ease;
  }
  .card:hover .ext {
    color: #e2e5ea;
    translate: 2px -2px;
  }
  .ext svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  footer { margin-top: 28px; font-size: 12px; color: #6d727c; }

  @media (max-width: 480px) {
    .card { padding: 13px 14px; gap: 12px; }
    .icon { width: 40px; height: 40px; border-radius: 10px; }
    .chip { font-size: 10.8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
